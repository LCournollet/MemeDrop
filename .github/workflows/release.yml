name: Release app

# Publie automatiquement quand la version de package.json change sur main :
#   bump "version" dans package.json -> commit -> git push
# (un tag vX.Y.Z ou un lancement manuel marchent aussi.)
# Si la version est deja celle de latest.json sur le VPS, rien n'est publie.
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  SITE_URL: https://memedrop.57-131-40-94.sslip.io

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare version with published one
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME != version package.json ($VERSION)"
            exit 1
          fi
          PUBLISHED=$(curl -fsS "$SITE_URL/latest.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || echo none)
          echo "package.json=$VERSION publie=$PUBLISHED"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == "$PUBLISHED" ]]; then
            echo "Version $VERSION deja publiee, rien a faire."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build installer
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/MemeDrop-Setup-*.exe
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: release

      - name: Upload site + installer to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'site,deploy,release'
          target: 'memedrop-site-upload'
          rm: true

      - name: Publish on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: VERSION
          script: |
            set -e
            UP=~/memedrop-site-upload
            bash $UP/deploy/setup-site.sh $UP
            cp $UP/release/MemeDrop-Setup-$VERSION.exe /var/www/memedrop/download/
            bash $UP/deploy/publish-release.sh "$VERSION" "MemeDrop-Setup-$VERSION.exe"

      # Optionnel : continue de publier sur le repo GitHub de releases pour les
      # clients <= 0.6.5 qui cherchent encore les MAJ la-bas. Ajoute le secret
      # RELEASES_TOKEN (PAT avec acces a LCournollet/memedrop-releases) pour l'activer.
      - name: Mirror to GitHub releases (legacy clients)
        if: env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: LCournollet/memedrop-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: MemeDrop v${{ env.VERSION }}
          files: release/MemeDrop-Setup-${{ env.VERSION }}.exe

      - name: Tag the release commit
        if: github.ref_type != 'tag'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION existe deja"
          else
            git tag "v$VERSION" "$GITHUB_SHA"
            git push origin "v$VERSION"
          fi
