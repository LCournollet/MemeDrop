name: Deploy download site to VPS

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'deploy/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload site to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'site,deploy'
          target: 'memedrop-site-upload'
          rm: true

      - name: Install site (nginx + HTTPS)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash ~/memedrop-site-upload/deploy/setup-site.sh ~/memedrop-site-upload
