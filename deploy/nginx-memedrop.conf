# Site de telechargement MemeDrop. Ne repond que pour son server_name.
# certbot --nginx ajoute ensuite le bloc 443 + la redirection HTTP -> HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name memedrop.57-131-40-94.sslip.io;

    root /var/www/memedrop;
    index index.html;

    location = /latest.json {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }

    location /download/ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=300";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
